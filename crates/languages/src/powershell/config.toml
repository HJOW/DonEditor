name = "PowerShell"
grammar = "powershell"
path_suffixes = ["ps1", "psm1", "psd1"]
first_line_pattern = '^#!.*\b(?:pwsh|powershell)\b'
modeline_aliases = ["ps1", "pwsh", "powershell"]
line_comments = ["# "]
block_comment = { start = "<#", prefix = "", end = "#>", tab_size = 1 }
autoclose_before = ";:.,=}])>"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
tab_size = 4
