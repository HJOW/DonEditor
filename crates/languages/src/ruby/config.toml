name = "Ruby"
grammar = "ruby"
path_suffixes = ["rb", "rake", "gemspec", "ru", "Gemfile", "Rakefile"]
first_line_pattern = '^#!.*\bruby\b'
modeline_aliases = ["rb"]
line_comments = ["# "]
autoclose_before = ";:.,=}])>"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
tab_size = 2
