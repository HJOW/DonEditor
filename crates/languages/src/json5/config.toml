name = "JSON5"
grammar = "json5"
path_suffixes = ["json5"]
line_comments = ["// "]
block_comment = { start = "/*", prefix = "", end = "*/", tab_size = 1 }
autoclose_before = ",]}"
brackets = [
  { start = "{", end = "}", close = true, surround = true, newline = true },
  { start = "[", end = "]", close = true, surround = true, newline = true },
  { start = "\"", end = "\"", close = true, surround = true, newline = false, not_in = ["comment", "string"] },
  { start = "'", end = "'", close = true, surround = true, newline = false, not_in = ["comment", "string"] },
]
tab_size = 2
