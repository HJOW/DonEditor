[package]
name = "agent_panel"
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
publish.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow.workspace = true
db = { workspace = true, optional = true }
don_tools = { workspace = true, optional = true }
editor = { workspace = true, optional = true }
futures.workspace = true
gpui = { workspace = true, optional = true }
http_client.workspace = true
i18n = { workspace = true, optional = true }
log = { workspace = true, optional = true }
markdown = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
smol.workspace = true
ui = { workspace = true, optional = true }
ui_input = { workspace = true, optional = true }
workspace = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service"], optional = true }

[dev-dependencies]
http_client = { workspace = true, features = ["test-support"] }

[features]
# 실제 앱에서는 UI·OS 자격 증명 저장소를 포함하며, 프로토콜 검증은 GUI 없이 실행할 수 있다.
default = ["gui"]
gui = ["dep:db", "dep:don_tools", "dep:editor", "dep:gpui", "dep:i18n", "dep:log", "dep:markdown", "dep:schemars", "dep:ui", "dep:ui_input", "dep:workspace", "dep:keyring"]

[lints]
workspace = true
